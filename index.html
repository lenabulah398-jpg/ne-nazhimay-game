<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Don't Press</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #111111;
color: white;
font-family: Arial, sans-serif;
text-align: center;
}

.container {
max-width: 500px;
margin: auto;
padding: 25px 15px;
}

.game {
background: #1d1d22;
border-radius: 25px;
padding: 25px 18px;
border: 1px solid #333;
}

.stats {
font-size: 16px;
color: #aaaaaa;
margin-bottom: 20px;
}

h1 {
font-size: 32px;
margin: 10px 0;
}

#message {
color: #aaaaaa;
min-height: 50px;
font-size: 17px;
}

#pressButton {
width: 100%;
height: 170px;
margin-top: 20px;

border: none;
border-radius: 30px;

background: #ff3366;
color: white;

font-size: 28px;
font-weight: bold;

cursor: pointer;

-webkit-tap-highlight-color: transparent;
}

#pressButton:active {
transform: scale(0.96);
}

.buttons {
margin-top: 18px;
}

.secondary {
background: #29292f;
color: white;

border: 1px solid #444;

border-radius: 14px;

padding: 12px 20px;

font-size: 16px;
}

#result {
margin-top: 20px;
padding: 15px;

background: #29292f;
border-radius: 15px;

display: none;
}
</style>

</head>

<body>

<div class="container">

<div class="game">

<div class="stats">
Уровень: <b id="level">1</b>
&nbsp; • &nbsp;
Очки: <b id="score">0</b>
</div>

<h1 id="title">НЕ НАЖИМАЙ 😈</h1>

<div id="message">
Серьёзно. Не нажимай эту кнопку.
</div>

<button id="pressButton">
НЕ НАЖИМАТЬ
</button>

<div class="buttons">

<button class="secondary" id="resetButton">
↻ Начать заново
</button>

</div>

<div id="result"></div>

</div>

</div>


<script>

(function () {

let score = 0;
let level = 1;
let clicks = 0;

const button = document.getElementById("pressButton");
const scoreElement = document.getElementById("score");
const levelElement = document.getElementById("level");
const titleElement = document.getElementById("title");
const messageElement = document.getElementById("message");
const resetButton = document.getElementById("resetButton");
const resultElement = document.getElementById("result");


button.addEventListener("click", function () {

clicks++;

score += 10;

if (clicks >= 3 && level < 10) {
level++;
}

scoreElement.textContent = score;
levelElement.textContent = level;

titleElement.textContent = "ТЫ НАЖАЛ 😈";

messageElement.textContent =
"Я же просила не нажимать! Нажми ещё раз.";

button.textContent = "ЕЩЁ РАЗ 🔥";


if (level >= 10) {

resultElement.style.display = "block";

resultElement.innerHTML =
"<strong>🏆 ТЫ ПОБЕДИЛ!</strong><br><br>" +
"Твой счёт: " + score;

button.textContent = "ПОБЕДА! 🎉";
}

});


resetButton.addEventListener("click", function () {

score = 0;
level = 1;
clicks = 0;

scoreElement.textContent = "0";
levelElement.textContent = "1";

titleElement.textContent = "НЕ НАЖИМАЙ 😈";

messageElement.textContent =
"Серьёзно. Не нажимай эту кнопку.";

button.textContent = "НЕ НАЖИМАТЬ";

resultElement.style.display = "none";

});


})();

</script>

</body>
</html>04:04
